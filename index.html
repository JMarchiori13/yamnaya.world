<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Encontre casas de massagem, spas e centros de bem-estar perto de você, com avaliações reais do Google e TripAdvisor.">
<meta name="theme-color" content="#0f172a">
<title>Encontrar Massagem Perto de Mim</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Massagem Perto de Mim">
<meta property="og:description" content="Encontre casas de massagem, spas e centros de bem-estar perto de você, com avaliações reais do Google e TripAdvisor.">
<meta property="og:url" content="https://yamnaya.world/">
<meta property="og:site_name" content="Massagem Perto de Mim">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Massagem Perto de Mim">
<meta name="twitter:description" content="Encontre casas de massagem e spas perto de você.">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">♨</span>
      <h1>Massagem Perto de Mim</h1>
    </div>
    <div class="controls">
      <label class="radius">
        Raio
        <select id="radius">
          <option value="1000">1 km</option>
          <option value="2000">2 km</option>
          <option value="5000" selected>5 km</option>
          <option value="10000">10 km</option>
          <option value="20000">20 km</option>
        </select>
      </label>
      <button id="locate" type="button">📍 Minha localização</button>
      <button id="toggleSidebar" class="toggle-sidebar" type="button" aria-label="Mostrar/ocultar lista" aria-expanded="true">▾</button>
    </div>
  </header>

  <main class="layout">
    <section class="sidebar" aria-label="Lista de locais">
      <div class="search-wrap">
        <form id="searchForm" class="search">
          <input id="searchInput" type="search" placeholder="Buscar cidade, bairro ou endereço" autocomplete="off"
            role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list">
          <button type="submit">Buscar</button>
        </form>
        <ul id="suggestions" class="suggestions hidden" role="listbox"></ul>
      </div>

      <div id="filters" class="filters" aria-label="Filtros por tipo de massagem"></div>

      <label class="sort-bar">
        Ordenar
        <select id="sortBy">
          <option value="dist">Mais próximos</option>
          <option value="open">Aberto agora</option>
          <option value="name">Nome (A-Z)</option>
        </select>
      </label>

      <div id="cacheBadge" class="cache-badge hidden" aria-live="polite"></div>

      <div id="status" class="status" role="status" aria-live="polite">
        Clique em <strong>📍 Minha localização</strong> ou busque um endereço para começar.
      </div>

      <ul id="results" class="results"></ul>

      <footer class="credits">
        Dados © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
        · Busca via <a href="https://overpass-api.de/" target="_blank" rel="noopener">Overpass</a>
        · Geocoder <a href="https://nominatim.openstreetmap.org/" target="_blank" rel="noopener">Nominatim</a>
      </footer>
    </section>

    <div id="map" class="map" aria-label="Mapa"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
